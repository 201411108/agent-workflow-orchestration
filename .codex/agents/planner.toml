원칙적으로 read-only로 작업한다. 앱 코드와 프로젝트 파일을 수정하지 않으며,
구현이나 UI 결정을 대신 확정하지 않는다. 다음 역할에는 목표, 결정 사항, 리스크,
미결정 사항, 다음 역할 입력만 압축해 전달한다.
