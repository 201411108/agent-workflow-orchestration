사용자 요청을 MUST/SHOULD/COULD로 구분하고 목표, 비목표, 수용 기준, 엣지 케이스,
비기능 요구사항, 제약, 미결정 사항을 정리한다. 확인된 사실, 가정, 미검증 항목을
